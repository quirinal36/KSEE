# ==========================================================================
# 챗봇(OpenRouter) 설정
# --------------------------------------------------------------------------
# 보안: 실제 API 키는 이 파일에 커밋하지 마세요.
#   1순위) 환경변수  OPENROUTER_API_KEY  (권장, Git 에 남지 않음)
#   2순위) 아래 openrouter.api.key 값 (로컬에서만 채워 사용, 커밋 금지)
# 서버는 환경변수를 우선 사용하고, 없으면 아래 프로퍼티 값을 사용합니다.
# ==========================================================================

# OpenRouter Chat Completions 엔드포인트
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# 기본 모델 (저비용). 필요시 여기만 바꾸면 됩니다.
openrouter.model=google/gemini-2.0-flash-001

# API 키 (비워둠 - 환경변수 OPENROUTER_API_KEY 로 주입 권장)
openrouter.api.key=

# OpenRouter 랭킹/식별용 헤더 (선택)
openrouter.referer=https://www.ksee.kr
openrouter.title=KSEE Chatbot

# 답변 최대 토큰 수
openrouter.max.tokens=1024

# 비로그인 사용자 요청 제한 (분당 최대 요청 수, IP 기준). 0 이면 제한 없음
chatbot.ratelimit.per.minute=15
