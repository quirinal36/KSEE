cont.greet_text   = <div class="greet_txt"><p style="word-break: keep-all;"><b style="font-size: 20px;">\uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C \uD68C\uC6D0\uB2D8\uB4E4\uAED8</b><br><br>\uC548\uB155\uD558\uC2ED\uB2C8\uAE4C. \uC800\uB294 \uAE08\uB144\uBD80\uD130 2\uB144\uAC04\uC758 \uC784\uAE30\uB85C \uC5F0\uAD6C\uD68C \uD68C\uC7A5\uC744 \uB9E1\uC544 \uBD09\uC9C1\uD558\uAC8C \uB41C \uC6B8\uC0B0\uACFC\uD559\uAE30\uC220\uC6D0 \uAE40\uC6A9\uD658 \uAD50\uC218\uC785\uB2C8\uB2E4.<br><br>\uC800\uD76C \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uAC00 2015\uB144 8\uC6D4\uC5D0 \uCC3D\uB9BD\uB418\uACE0 \uB0B4\uB144\uC774\uBA74 \uBC8C\uC368 10\uB144\uC774 \uB2E4 \uB418\uC5B4\uAC11\uB2C8\uB2E4. \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uB294 \uAE30\uC874 \uD559\uD68C\uC640\uB294 \uB2EC\uB9AC \uC804\uBB38\uC801\uC73C\uB85C \uC2EC\uB3C4\uC788\uAC8C \uD6A8\uC18C\uACF5\uD559\uC744 \uC5F0\uAD6C\uD558\uACE0 \uD1A0\uB860\uD558\uACE0 \uC815\uBCF4\uB97C \uACF5\uC720\uD558\uC790\uB294 \uCDE8\uC9C0\uB85C \uC124\uB9BD\uD558\uC600\uC2B5\uB2C8\uB2E4. \uADF8\uB798\uC11C \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uB294 \uBBF8\uAD6D\uC758 \uACE0\uB4E0\uCEE8\uD37C\uB7F0\uC2A4\uCC98\uB7FC \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uC758 \uCD5C\uC2E0\uB3D9\uD5A5\uC744 \uACF5\uC720\uD558\uACE0 \uC5F0\uAD6C\uC5D0 \uC911\uC2EC\uC744 \uB450\uB294 \uBC18\uBA74, \uD559\uD68C \uC6B4\uC601\uC5D0 \uB4E4\uC774\uB294 \uC218\uACE0\uB294 \uCD5C\uC18C\uD55C\uC73C\uB85C \uD558\uC790\uB294 \uAC83\uC774 \uCDE8\uC9C0\uAC00 \uB418\uC5B4 \uBC1C\uC871\uD558\uAC8C \uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uB7EC\uD55C \uB73B\uC73C\uB85C \uBC1C\uC871\uD558\uAC8C \uB41C \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uB294 \uAE40\uD559\uC131 \uC804\uC784\uD68C\uC7A5\uB2D8\uACFC \uC774\uC2B9\uAD6C \uC804\uC784\uD68C\uC7A5\uB2D8\uC774 \uD6CC\uB96D\uD55C \uCD08\uC11D\uC744 \uB9C8\uB828\uD558\uC600\uB2E4\uACE0 \uC0DD\uAC01\uB429\uB2C8\uB2E4. \uADF8\uB9AC\uACE0 \uC5EC\uAE30\uC5D0 \uCC38\uC5EC\uD558\uC2E0 \uC5EC\uB7EC \uD68C\uC6D0 \uC5EC\uB7EC\uBD84\uB4E4 \uADF8\uB9AC\uACE0 \uC774\uC0AC\uB2D8, \uAC04\uC0AC\uB2D8\uB4E4\uC758 \uC5F4\uC815\uC73C\uB85C \uC5EC\uAE30\uAE4C\uC9C0 \uBC1C\uC804\uD558\uAC8C \uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC800\uB3C4 \uC5EC\uAE30\uC5D0 \uB204\uAC00 \uB418\uC9C0 \uC54A\uB3C4\uB85D \uB178\uB825\uD558\uC5EC \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uAC00 \uBC1C\uD45C\uD560 \uC218 \uC788\uB3C4\uB85D \uD558\uACA0\uC2B5\uB2C8\uB2E4. <br><br>\uCD5C\uADFC \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uB294 \uB2E8\uBC31\uC9C8 3\uCC28\uAD6C\uC870\uC758 \uC608\uCE21\uC774 AI\uB97C \uC774\uC6A9\uD558\uC5EC \uAC00\uB2A5\uD558\uAC8C \uB418\uBA74\uC11C \uB2E4\uB978 \uCC28\uC6D0\uC73C\uB85C \uBC1C\uC804\uD558\uACE0 \uC788\uB2E4\uACE0 \uD310\uB2E8\uB429\uB2C8\uB2E4. \uC55E\uC73C\uB85C \uC774\uB7EC\uD55C \uC5F0\uAD6C\uB294 \uC6B0\uB9AC\uC758 \uC0C1\uC0C1\uB825\uC774 \uBC1C\uC804\uC744 \uC81C\uD55C\uD560 \uBFD0 \uADF8 \uB05D\uC744 \uC54C\uAE30 \uC5B4\uB824\uC6B8 \uC9C0\uACBD\uC73C\uB85C \uBC1C\uC804\uD560 \uAC83\uC73C\uB85C \uC608\uC0C1\uB429\uB2C8\uB2E4. \uD6A8\uC18C\uB294 \uD569\uC131\uC0DD\uBB3C\uD559\uC744 \uC774\uB8E8\uB294 \uD575\uC2EC\uADFC\uAC04\uC774 \uB418\uB294 \uC0DD\uBB3C\uBD84\uC790\uC785\uB2C8\uB2E4. \uC774\uB97C \uAE4A\uC219\uC774 \uC774\uD574\uD560\uC218\uB85D \uD6A8\uC18C\uB97C \uD654\uD559\uCD09\uB9E4 \uB300\uC2E0\uC5D0 \uC0AC\uC6A9\uD558\uB294 \uAC83\uC744 \uB118\uC5B4\uC11C \uBC14\uC774\uC624\uC758\uB8CC \uB4F1\uC758 \uBD84\uC57C\uB85C \uBB34\uD55C\uD655\uC7A5\uC774 \uAC00\uB2A5\uD560 \uAC83\uC73C\uB85C \uBBFF\uC2B5\uB2C8\uB2E4. <br><br>\uC55E\uC73C\uB85C \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uC758 \uC9C0\uACBD\uC744 \uB113\uD788\uACE0 \uB2E4\uC591\uD55C \uD68C\uC6D0\uB4E4\uC774 \uCC38\uAC00\uD558\uACE0, \uBC1C\uD45C\uD558\uACE0, \uC9C0\uC2DD\uC744 \uACF5\uC720\uD558\uB294 \uC7A5\uC774 \uB420 \uC218 \uC788\uB3C4\uB85D \uB354 \uB178\uB825\uD558\uB3C4\uB85D \uD558\uACA0\uC2B5\uB2C8\uB2E4. \uC0B0\uC5C5\uACC4\uC5D0\uC11C \uC9C0\uD5A5\uD558\uACE0 \uC788\uB294 \uD6A8\uC18C \uAD00\uB828 \uBD84\uC57C\uC758 \uC5F0\uAD6C\uC5D0 \uB300\uD574\uC11C\uB3C4 \uACF5\uC720\uD558\uB294 \uC790\uB9AC\uB97C \uB9CC\uB4E4\uB3C4\uB85D \uB354 \uB178\uB825\uD558\uACA0\uC2B5\uB2C8\uB2E4. \uD68C\uC6D0\uB2D8, \uC774\uC0AC\uB2D8, \uAC04\uC0AC\uB2D8\uB4E4\uC758 \uC804\uD3ED\uC801\uC778 \uD611\uC870\uAC00 \uD544\uC694\uD560 \uAC83 \uAC19\uC2B5\uB2C8\uB2E4. \uC55E\uC73C\uB85C \uD6A8\uC18C\uACF5\uD559\uBC1C\uC804 \uBC0F \uD559\uBB38\uD6C4\uC18D\uC138\uB300\uB97C \uD0A4\uC6CC\uB0BC \uC218 \uC788\uB3C4\uB85D \uB9CE\uC774 \uB3C4\uC640\uC8FC\uC2DC\uAE38 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4. <br><br>\uD68C\uC7A5 <b style="font-size: 20px;">\uAE40\uC6A9\uD658</b> \uB4DC\uB9BC</p></div>
