cont.greet_text   = <div><p class="0">\uC548\uB155\uD558\uC2ED\uB2C8\uAE4C<p class="0">  <!--[if !supportEmptyParas]-->&nbsp;<!--[endif]-->  <o:p></o:p></p><p class="0">\uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uAC00 <span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">2015</span>\uB144 <span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">8</span>\uC6D4\uC5D0 \uCC3D\uB9BD\uB418\uACE0 \uBC8C\uC368 <span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">6</span>\uB144\uC774 \uB2E4 \uB418\uC5B4\uAC11\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span></p><p class="0">\uADF8\uB3D9\uC548 \uD68C\uC6D0 \uC5EC\uB7EC\uBD84\uB4E4\uACFC \uC774\uC0AC\uB2D8\uB4E4\uC758 \uC5F4\uC815\uC5D0 \uC624\uB298\uC758 \uC5F0\uAD6C\uD68C\uAC00 \uC788\uAC8C \uB418\uC5C8\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span>\uD2B9\uD788 \uCC3D\uB9BD\uC774\uB798 \uBCF8 \uC5F0\uAD6C\uD68C\uB97C \uC774\uB04C\uC5B4 \uC8FC\uC2E0 \uC804\uC784 \uD68C\uC7A5\uB2D8\uAED8 \uAE4A\uC740 \uAC10\uC0AC\uB97C \uB4DC\uB9AC\uBA70 \uBBF8\uB825\uD558\uB098\uB9C8 \uADF8\uB3D9\uC548\uC758 \uBC1C\uC804\uC744 \uC774\uC5B4\uAC00\uB3C4\uB85D \uB178\uB825\uD558\uACA0\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span></p><p class="0">  <!--[if !supportEmptyParas]-->&nbsp;<!--[endif]-->  <o:p></o:p></p><p class="0">\uCD5C\uADFC \uACFC\uD559\uACC4\uB294 \uC0DD\uBA85\uD604\uC0C1\uC5D0 \uB300\uD55C \uB300\uB7C9 \uC815\uBCF4\uB97C \uD68D\uB4DD\uD558\uACE0 <span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">AI</span>\uB97C \uC811\uBAA9\uD558\uC5EC \uBCF5\uC7A1\uC131\uC744 \uADF9\uBCF5\uD558\uB294 \uBC14\uC774\uC624\uACF5\uD559\uC5D0 \uB300\uD55C \uAD00\uC2EC\uC774 \uB728\uAC81\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span>\uD6A8\uC18C\uB294 \uC0DD\uCCB4 \uB0B4 \uBAA8\uB4E0 \uD654\uD559\uC801 \uAE30\uB2A5\uC744 \uCC45\uC784\uC9C0\uB294 \uAC00\uC7A5 \uC5ED\uB3D9\uC801\uC778 \uBD84\uC790\uB85C\uC11C \uC2E0\uAC1C\uB150 \uCE58\uB8CC<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uD0C4\uC18C\uC911\uB9BD<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uCE5C\uD658\uACBD \uACF5\uC815\uAE30\uC220 \uAC1C\uBC1C \uB4F1 \uBC14\uC774\uC624\uACF5\uD559\uC758 \uD575\uC2EC\uC785\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span>\uC6B0\uB9AC \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uB294 \uD6A8\uC18C \uBD84\uC790\uC758 \uD575\uC2EC \uAE30\uB2A5\uACFC \uD2B9\uC131\uC744 \uC774\uD574\uD558\uACE0 \uC774\uB97C \uBC14\uD0D5\uC73C\uB85C \uB2E4\uC591\uD55C \uC0B0\uC5C5\uC801 \uD65C\uC6A9 \uBC29\uC548\uC744 \uCC3E\uB294 \uC2EC\uB3C4 \uC788\uB294 \uB17C\uC758\uC640 \uC815\uBCF4 \uAD50\uD658\uC758 \uC7A5\uC774 \uB418\uC5B4 \uC654\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">.</span></p><p class="0">  <!--[if !supportEmptyParas]-->&nbsp;<!--[endif]-->  <o:p></o:p></p><p class="0">\uB9E4\uB144 \uB450 \uCC28\uB840 \uAC1C\uCD5C\uB41C \uC2EC\uD3EC\uC9C0\uC5C4\uC5D0\uC11C\uB294 \uAD6D\uB0B4\uB97C \uB300\uD45C\uD558\uB294 \uD6A8\uC18C \uC804\uBB38\uAC00\uB4E4\uC774 \uBAA8\uC5EC \uC5F0\uAD6C \uB3D9\uD5A5\uACFC \uCD5C\uC2E0 \uC774\uC288\uB97C \uACF5\uC720\uD574 \uC654\uACE0 \uCC38\uC11D\uC790\uB4E4\uACFC \uD5A5\uD6C4 \uBC1C\uC804\uC5D0 \uB300\uD55C \uBB34\uC81C\uD55C \uD1A0\uB860\uC744 \uC9C4\uD589\uD574 \uC654\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span>\uC774\uB294 \uAE30\uC874 \uD559\uD68C\uC5D0\uC11C \uCC44\uC6B0\uAE30 \uC5B4\uB824\uC6B4 \uAC08\uC99D\uC774\uC5C8\uACE0 \uC5F0\uAD6C\uD68C\uAC00 \uC131\uACF5\uC801\uC73C\uB85C \uC815\uCC29\uD558\uB294 \uAE30\uBC18\uC774 \uB418\uC5C8\uC2B5\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">.</span></p><p class="0">  <!--[if !supportEmptyParas]-->&nbsp;<!--[endif]-->  <o:p></o:p></p><p class="0">\uC774\uC81C <span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">10</span>\uB144\uC744 \uD5A5\uD574 \uB098\uC544\uAC00\uB294 \uC2DC\uC810\uC5D0 \uADF8\uB3D9\uC548 \uC120\uBC30\uB2D8\uB4E4\uC774 \uC77C\uAD6C\uC5B4 \uC8FC\uC2E0 \uC790\uC2E0\uAC10\uC744 \uBC14\uD0D5\uC73C\uB85C \uB354 \uC80A\uAC8C \uB354 \uD65C\uBC1C\uD55C \uD1A0\uB860\uC744 \uC774\uB04C \uC218 \uC788\uB294 \uBAA8\uC784\uC73C\uB85C \uAC70\uB4ED\uB098\uB824\uACE0 \uD569\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">. </span>\uC774\uB97C \uC704\uD574 \uC774\uC0AC\uD68C\uC640 \uBCC4\uB3C4\uB85C \uC2E4\uBB34\uC911\uC2EC\uC758 \uAC04\uC0AC\uD68C\uB97C \uAD6C\uC131\uD558\uC5EC \uC80A\uC740 \uB9AC\uB354\uB4E4\uC758 \uD65C\uB3D9\uC744 \uC7A5\uB824\uD558\uB824 \uD558\uACE0<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uD2B9\uD788 \uD68C\uC6D0\uB2D8\uB4E4\uC758 \uC131\uACFC\uD64D\uBCF4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uAD6C\uC778<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">/</span>\uAD6C\uC9C1<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uC758\uACAC\uAD50\uD658\uB3C4 \uAC00\uB2A5\uD558\uB3C4\uB85D \uD648\uD398\uC774\uC9C0 \uC6B4\uC6A9\uC744 \uB2E4\uCC44\uB86D\uAC8C \uD558\uB824 \uD569\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">.</span></p><p class="0">  <!--[if !supportEmptyParas]-->&nbsp;<!--[endif]-->  <o:p></o:p></p><p class="0">\uD68C\uC6D0\uB2D8<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uCF54\uB85C\uB098<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">19 </span>\uC720\uD589\uC73C\uB85C \uC778\uD55C \uC704\uCD95\uC5D0\uB3C4 \uBD88\uAD6C\uD558\uACE0 \uC628\uB77C\uC778 \uBC0F \uC18C\uBAA8\uC784\uC744 \uD1B5\uD574 \uC5F0\uAD6C\uD68C \uD65C\uB3D9\uC744 \uC9C0\uC18D\uC2DC\uD0A4\uACE0<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0D5;mso-font-width:100%;letter-spacing:0.0pt;mso-text-raise:0.0pt;">, </span>\uC131\uD07C \uB2E4\uAC00\uC628 \uBC14\uC774\uC624 \uACBD\uC81C\uC2DC\uB300\uC5D0 \uD6A8\uC18C\uACF5\uD559\uC5F0\uAD6C\uD68C\uAC00 \uB354 \uD070 \uC8FC\uC5ED\uC73C\uB85C \uB098\uC124 \uC218 \uC788\uB3C4\uB85D \uC801\uADF9\uC801\uC778 \uCC38\uC5EC\uC640 \uB3C4\uC6C0\uC744 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4<span lang="EN-US" style="font-family:\uD568\uCD08\uB86C\uBC14\uD0